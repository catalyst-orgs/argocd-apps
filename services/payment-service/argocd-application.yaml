apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payment-service
  namespace: argocd
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: platform-services
    environment: production
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  project: applications
  source:
    repoURL: https://github.com/catalyst-orgs/payment-service
    targetRevision: main
    path: kubernetes
  destination:
    server: https://vcluster-payment-service.vcluster-payment-service.svc.cluster.local
    namespace: payment-service
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 3m