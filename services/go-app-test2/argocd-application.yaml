apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: go-app-test2
  namespace: argocd
  labels:
    app.kubernetes.io/name: go-app-test2
    app.kubernetes.io/part-of: platform-services
    environment: production
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  project: applications
  source:
    repoURL: https://github.com/catalyst-orgs/go-app-test2
    targetRevision: main
    path: kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: go-app-test2
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 3m